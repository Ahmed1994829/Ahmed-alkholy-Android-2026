
name: Build Ahmed alkholy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Ahmed_alkholy_Android_GitHub_Ready_FIXED2.zip -d project
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-alkholy-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
